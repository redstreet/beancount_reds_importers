name: Conventional Commits

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!/^(feat|fix|perf|refactor|docs|doc|test|build|ci|chore|style|revert|deps)(\([^)]+\))?!?: .+/.test(title)) {
              core.setFailed('Use a Conventional Commit PR title, e.g. fix(schwab): handle missing fees');
            }
