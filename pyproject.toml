[project]
name = "beancount_reds_importers"
version = "1.0.0.dev0"
license = "GPL-3.0"
description = "Importers for various institutions for Beancount"
readme = "README.md"
authors = [
  { name = "Red Street", email = "redstreet@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = ["importer", "ingestor", "beancount", "accounting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "click >= 8.1.7",
  "beangulp >= 0.2.0",
  "beancount >= 3.0.0",
  "beautifulsoup4 >= 4.12.3",
  "click_aliases >= 1.0.4",
  "dateparser >= 1.2.0",
  "loguru>=0.7.3",
  "lxml >= 4.9",
  "ofxparse >= 0.21",
  "openpyxl >= 3.1.2",
  "packaging >= 23.1",
  "pdfplumber>=0.11.0",
  "petl >= 1.7.15",
  "python-dateutil >= 2.8.2",
  "tabulate >= 0.9.0",
  "tqdm >= 4.66.2",
  "requests>=2.32.3",
  "xlrd>=2.0.1",
]

[project.urls]
Repository = "https://github.com/redstreet/beancount_reds_importers"

[project.scripts]
ofx-summarize = "beancount_reds_importers.util.ofx_summarize:summarize"
bean-download = "beancount_reds_importers.util.bean_download:cli"
reds-ibkr-flexquery-download = "beancount_reds_importers.importers.ibkr.flexquery_download:flexquery_download"

[project.optional-dependencies]
dev = ["isort", "pytest", "pytest-cov", "ruff", "build", "twine", "hatchling>=1.27,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beancount_reds_importers"]
exclude = ["**/tests/**", "**/fidelity_cma_csv_examples/**"]

[tool.hatch.build.targets.sdist]
include = [
  "/beancount_reds_importers", "/tests", "/scripts", "/conftest.py",
  "/pyproject.toml", "/uv.lock", "/*.md", "/LICENSE", "/requirements.txt",
  "/release-please-config.json", "/.release-please-manifest.json",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
  # silence warning in ofxparse
  "ignore:Call to deprecated method findAll:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["beancount_reds_importers"]
omit = ["*/tests/*", "*/example/*", "*/fidelity_cma_csv_examples/*"]

[tool.coverage.report]
show_missing = true
